<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Timer</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1c2230; --muted:#6b7385; --line:#e3e6ec; --accent:#2f6fed; --stop:#d64545; --live:#e8f7ee; --livebar:#22a45d; --today:#eef3ff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171f; --card:#1d222d; --text:#e8ebf2; --muted:#8e97ab; --line:#2c3342; --accent:#5b8cff; --stop:#ef6b6b; --live:#17301f; --livebar:#3ecf7d; --today:#202a40; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif; }
  main { max-width:960px; margin:0 auto; padding:24px 16px 48px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  h1 { font-size:22px; margin:0; }
  .tabs { display:flex; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:3px; }
  .tabs button { background:transparent; color:var(--muted); padding:6px 16px; }
  .tabs.sub { width:max-content; margin-bottom:14px; }
  .period { margin:-4px 0 14px; }
  .period[hidden] { display:none; }
  .period select { padding:6px 10px; font:inherit; font-size:14px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); }
  .tabs button.on { background:var(--accent); color:#fff; }
  form { display:flex; gap:8px; margin-bottom:20px; }
  input { flex:1; min-width:0; padding:12px 14px; font-size:16px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--text); }
  input:focus { outline:2px solid var(--accent); border-color:transparent; }
  button { font:inherit; cursor:pointer; border:0; border-radius:10px; padding:10px 16px; background:var(--accent); color:#fff; font-weight:600; }
  button.stop { background:var(--stop); }
  button.ghost { background:transparent; color:var(--muted); padding:6px 10px; font-weight:500; }
  button.ghost:hover { color:var(--text); }
  button.outline { background:var(--card); color:var(--text); border:1px solid var(--line); padding:6px 12px; font-weight:500; }
  #timerView, #weekView { max-width:640px; }
  #weekView { max-width:none; }
  .task { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; display:flex; align-items:center; gap:12px; }
  .task.live { background:var(--live); border-left-color:var(--livebar); }
  .dot { width:10px; height:10px; border-radius:50%; flex:none; }
  .info { flex:1; min-width:0; }
  .name { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .time { font-variant-numeric:tabular-nums; font-size:20px; color:var(--muted); }
  .live .time { color:var(--text); }
  .actions { display:flex; align-items:center; gap:2px; }
  .summary { display:flex; justify-content:space-between; align-items:center; color:var(--muted); margin:20px 2px 0; font-size:14px; }
  .empty { text-align:center; color:var(--muted); padding:32px 0; }

  .weekbar { display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .weekbar .label { font-weight:600; flex:1; text-align:center; min-width:150px; }
  .cal { display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:8px; }
  .cal.five { grid-template-columns:repeat(5, minmax(0,1fr)); }
  .opt input { flex:none; padding:0; }
  .opt { display:flex; align-items:center; gap:6px; font-size:14px; color:var(--muted); cursor:pointer; user-select:none; }
  .day { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 8px; min-height:140px; }
  .day.today { background:var(--today); border-color:var(--accent); }
  .dayhead { text-align:center; color:var(--muted); font-size:13px; padding-bottom:8px; margin-bottom:8px; border-bottom:1px solid var(--line); }
  .dayhead b { display:block; color:var(--text); font-size:15px; }
  .dayhead .tot { font-variant-numeric:tabular-nums; }
  .chip { border-radius:8px; padding:6px 8px; margin-bottom:6px; color:#fff; font-size:13px; line-height:1.25; }
  .chip.run { outline:2px solid var(--livebar); outline-offset:1px; }
  .chip .cn { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
  .chip .ct { font-variant-numeric:tabular-nums; opacity:.9; }
  .edit { display:flex; align-items:center; gap:8px; flex:1; min-width:0; flex-wrap:wrap; }
  .edit input[type=text] { padding:8px 10px; font-size:15px; flex:1; min-width:120px; }
  .edit input[type=color] { flex:none; width:40px; height:36px; padding:2px; border-radius:8px; cursor:pointer; }
  .edit button { padding:7px 12px; }
  .copy { display:block; margin:6px auto 0; padding:3px 10px; font-size:12px; font-weight:500; background:transparent; color:var(--muted); border:1px solid var(--line); border-radius:8px; }
  .copy:hover { color:var(--text); }
  .day { display:flex; flex-direction:column; }
  .add { margin-top:auto; align-self:center; width:32px; height:32px; padding:0; border-radius:50%; font-size:20px; line-height:1; font-weight:500; background:transparent; color:var(--muted); border:1px dashed var(--line); }
  .add:hover { color:var(--accent); border-color:var(--accent); }
  .chips { padding-bottom:8px; }
  dialog { border:1px solid var(--line); border-radius:14px; background:var(--card); color:var(--text); padding:20px; width:min(360px, calc(100vw - 32px)); }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  dialog form { display:block; margin:0; }
  dialog h2 { font-size:18px; margin:0 0 2px; }
  dialog .sub { color:var(--muted); font-size:14px; margin-bottom:14px; }
  dialog label { display:block; font-size:13px; color:var(--muted); margin-bottom:12px; }
  dialog label input { display:block; width:100%; margin-top:4px; }
  dialog .pair { display:flex; gap:10px; } dialog .pair label { flex:1; }
  dialog .btns { display:flex; justify-content:flex-end; gap:8px; margin-top:4px; }
  .none { text-align:center; color:var(--muted); font-size:13px; padding-top:8px; }
  .legend { margin-top:16px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 14px; }
  .legend .row { display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid var(--line); }
  .legend .row:last-child { border-bottom:0; }
  .legend .row .n { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .legend .row .t { font-variant-numeric:tabular-nums; color:var(--muted); }
  @media (max-width:760px) { .cal { grid-template-columns:1fr; } .day { min-height:0; } .dayhead { text-align:left; display:grid; grid-template-columns:1fr auto; align-items:baseline; } .dayhead .tot { grid-column:2; grid-row:1; } .copy { grid-column:1; grid-row:2; justify-self:start; margin:6px 0 0; } .dayhead b { display:inline; margin-left:6px; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Task Timer</h1>
    <div class="tabs">
      <button id="tabTimer" class="on">Timer</button>
      <button id="tabWeek">Week</button>
    </div>
  </header>

  <section id="timerView">
    <form id="form">
      <input id="name" placeholder="What are you working on?" autocomplete="off" maxlength="100" required>
      <button type="submit">Start</button>
    </form>
    <div class="tabs sub"><button id="modeToday" class="on">Today</button><button id="modeTotals">Totals</button></div>
    <label class="opt period" id="periodWrap" hidden>Period
      <select id="period">
        <option value="week">This week</option>
        <option value="month">This month</option>
        <option value="30d">Last 30 days</option>
        <option value="year">This year</option>
        <option value="all">All time</option>
      </select>
    </label>
    <div id="list"></div>
    <div class="summary"><span id="total"></span></div>
  </section>

  <section id="weekView" hidden>
    <div class="weekbar">
      <button class="outline" id="prev">‹ Prev</button>
      <div class="label" id="weekLabel"></div>
      <button class="outline" id="next">Next ›</button>
      <button class="outline" id="today">This week</button>
      <label class="opt"><input type="checkbox" id="weekends"> Show weekends</label>
    </div>
    <div class="cal" id="cal"></div>
    <div class="legend" id="legend"></div>
  </section>
</main>
<dialog id="addDlg">
  <form id="addForm" autocomplete="off">
    <h2>Add time manually</h2>
    <div class="sub" id="addDate"></div>
    <label>Task name<input type="text" id="addName" list="taskNames" maxlength="100" required></label>
    <datalist id="taskNames"></datalist>
    <div class="pair">
      <label>Hours<input type="number" id="addH" min="0" max="23" step="1" value="0" required></label>
      <label>Minutes<input type="number" id="addM" min="0" max="59" step="1" value="0" required></label>
    </div>
    <div class="btns"><button type="button" class="ghost" id="addCancel">Cancel</button><button type="submit">Add</button></div>
  </form>
</dialog>
<script>
const KEY = 'task-timer-v2', OLD_KEY = 'task-timer-v1';

// state: tasks [{id,name,base}] (base = time carried over from v1, no timestamps)
//        sessions [{id,taskId,start,end|null}] (end null = running)
let state = { tasks: [], sessions: [] };
try {
  const raw = localStorage.getItem(KEY);
  if (raw) state = JSON.parse(raw);
  else {
    const old = JSON.parse(localStorage.getItem(OLD_KEY) || '[]');
    state.tasks = old.map(t => ({ id: t.id, name: t.name, base: t.total }));
    old.filter(t => t.startedAt).forEach(t => state.sessions.push({ id: uid(), taskId: t.id, start: t.startedAt, end: null }));
  }
} catch (e) {}

function uid() { return crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const running = () => state.sessions.find(s => s.end == null);
const taskTime = t => t.base + state.sessions.filter(s => s.taskId === t.id).reduce((a, s) => a + (s.end ?? Date.now()) - s.start, 0);
const dayStart = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };
const nextDay = ds => { const d = new Date(ds); d.setDate(d.getDate() + 1); return d.getTime(); };   // DST-safe
const worksToday = (t, ds = dayStart()) => state.sessions.some(s => s.taskId === t.id && s.start < nextDay(ds) && (s.end ?? Date.now()) > ds);
const todayTime = (t, ds = dayStart()) => state.sessions.filter(s => s.taskId === t.id).reduce((a, s) => a + Math.max(0, Math.min(s.end ?? Date.now(), nextDay(ds)) - Math.max(s.start, ds)), 0);
// Delete a task's tracked time inside [from, to); sessions that straddle the range are trimmed, not dropped.
function removeRange(taskId, from, to) {
  const now = Date.now(), out = [];
  state.sessions.forEach(s => {
    const e = s.end ?? now;
    if (s.taskId !== taskId || e <= from || s.start >= to) return out.push(s);
    if (s.start < from) out.push({ ...s, end: from });
    if (e > to) out.push({ ...s, id: uid(), start: to });
  });
  state.sessions = out;
}
const fmt = ms => {
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return [h, m, s % 60].map(n => String(n).padStart(2, '0')).join(':');
};
const fmtShort = ms => { const m = Math.round(ms / 6e4); return m < 60 ? m + 'm' : Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm'; };
const hslHex = (h, s, l) => { s /= 100; l /= 100; const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l), f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1)); return '#' + [f(0), f(8), f(4)].map(x => Math.round(x * 255).toString(16).padStart(2, '0')).join(''); };
const colorOf = id => { const t = state.tasks.find(t => t.id === id); if (t && t.color) return t.color; let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) >>> 0; return hslHex(h % 360, 55, 42); };
const inkOf = hex => { const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)); return (r * 299 + g * 587 + b * 114) / 1000 > 150 ? '#111' : '#fff'; };
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);

function stopAll() { const r = running(); if (r) r.end = Date.now(); }
function start(id) {
  stopAll();                       // only one timer may run at a time
  timerMode = 'today';             // a started task belongs to today's list
  state.sessions.push({ id: uid(), taskId: id, start: Date.now(), end: null });
  save(); render();
}
function stop() { stopAll(); save(); render(); }

$('form').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('name').value.trim();
  if (!name) return;
  let t = state.tasks.find(t => t.name.toLowerCase() === name.toLowerCase());
  if (!t) { t = { id: uid(), name, base: 0 }; state.tasks.unshift(t); }
  $('name').value = '';
  start(t.id);
});

$('list').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const id = b.dataset.id;
  if (b.dataset.act === 'start') start(id);
  if (b.dataset.act === 'stop') stop();
  if (b.dataset.act === 'edit') { editingId = id; render(); }
  if (b.dataset.act === 'cancel') { editingId = null; render(); }
  if (b.dataset.act === 'continue') start(id);
  if (b.dataset.act === 'del') {   // deletes today's time only; earlier days are untouched
    const t = state.tasks.find(t => t.id === id);
    if (!confirm(`Remove today's time for "${t.name}"? It will also be removed from Totals and today's column on the Week tab.`)) return;
    removeRange(id, dayStart(), nextDay(dayStart())); save(); render();
  }
});

$('list').addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, t = state.tasks.find(t => t.id === f.dataset.id);
  const name = f.elements.name.value.trim();
  if (!name) return;
  if (state.tasks.some(o => o.id !== t.id && o.name.toLowerCase() === name.toLowerCase())) { alert('Another task already has that name.'); return; }
  t.name = name; t.color = f.elements.color.value;
  editingId = null; save(); render();
});


/* ---------- tabs & week navigation ---------- */
let view = 'timer', timerMode = 'today', renderedDay = null, editingId = null, showWeekends = false;
try { showWeekends = localStorage.getItem('task-timer-weekends') === '1'; } catch (e) {}
$('weekends').checked = showWeekends;
$('weekends').onchange = e => { showWeekends = e.target.checked; try { localStorage.setItem('task-timer-weekends', showWeekends ? '1' : '0'); } catch (e) {} renderWeek(); };
let weekStart = mondayOf(new Date());
function mondayOf(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function setView(v) {
  view = v;
  $('timerView').hidden = v !== 'timer'; $('weekView').hidden = v !== 'week';
  $('tabTimer').classList.toggle('on', v === 'timer'); $('tabWeek').classList.toggle('on', v === 'week');
  render();
}
$('modeToday').onclick = () => { timerMode = 'today'; editingId = null; render(); };
$('modeTotals').onclick = () => { timerMode = 'totals'; editingId = null; render(); };
let period = '30d';
try { period = localStorage.getItem('task-timer-period') || '30d'; } catch (e) {}
$('period').value = period = ['week', 'month', '30d', 'year', 'all'].includes(period) ? period : '30d';
$('period').onchange = e => { period = e.target.value; try { localStorage.setItem('task-timer-period', period); } catch (e) {} renderTimer(); };
$('tabTimer').onclick = () => setView('timer');
$('tabWeek').onclick = () => setView('week');
$('prev').onclick = () => { weekStart.setDate(weekStart.getDate() - 7); renderWeek(); };
$('next').onclick = () => { weekStart.setDate(weekStart.getDate() + 7); renderWeek(); };
$('today').onclick = () => { weekStart = mondayOf(new Date()); renderWeek(); };

/* ---------- timer view ---------- */
function renderTimer() {
  const r = running(), ds = dayStart(), today = timerMode === 'today';
  renderedDay = ds;
  $('modeToday').classList.toggle('on', today); $('modeTotals').classList.toggle('on', !today);
  $('periodWrap').hidden = today;
  // Today: tasks with time today. Totals: every task with time in the chosen period, biggest first.
  const shown = today ? state.tasks.filter(t => worksToday(t, ds))
                      : state.tasks.filter(t => periodMs(t) > 0).sort((a, b) => periodMs(b) - periodMs(a));
  $('list').innerHTML = shown.length ? shown.map(t => {
    const live = r && r.taskId === t.id;
    if (t.id === editingId) return `<div class="task" style="border-left-color:${colorOf(t.id)}">
      <form class="edit" data-id="${t.id}">
        <input type="color" name="color" value="${colorOf(t.id)}" title="Task color">
        <input type="text" name="name" value="${esc(t.name)}" maxlength="100" required aria-label="Task name">
        <button type="submit">Save</button>
        <button type="button" class="ghost" data-act="cancel">Cancel</button>
      </form></div>`;
    return `<div class="task ${live ? 'live' : ''}">
      <span class="dot" style="background:${colorOf(t.id)}"></span>
      <div class="info"><div class="name" title="${esc(t.name)}">${esc(t.name)}</div><div class="time" data-id="${t.id}">${fmt(shownMs(t))}</div></div>
      <div class="actions">
        ${today ? `<button class="ghost" data-act="edit" data-id="${t.id}" title="Edit name and color">Edit</button>
        <button class="ghost" data-act="del" data-id="${t.id}" title="Delete today's time for this task">✕</button>` : ''}
        ${live ? `<button class="stop" data-act="stop">Stop</button>` : `<button data-act="${today ? 'start' : 'continue'}" data-id="${t.id}">${today ? 'Start' : 'Continue'}</button>`}
      </div></div>`;
  }).join('') : `<div class="empty">${today ? 'Nothing tracked today yet. Type a task name above and press Start.' : 'No time tracked in this period.'}</div>`;
  const ed = document.querySelector('.edit input[name=name]'); if (ed && !ed.dataset.focused) { ed.dataset.focused = 1; ed.focus(); ed.select(); }
  tick();
}

/* ---------- week view ---------- */
let copyText = [];
let addDay = null;
$('cal').addEventListener('click', e => {
  const b = e.target.closest('[data-add]'); if (!b) return;
  addDay = +b.dataset.add;
  $('addDate').textContent = new Date(addDay).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  $('taskNames').innerHTML = state.tasks.map(t => `<option value="${esc(t.name)}">`).join('');
  $('addName').value = ''; $('addH').value = 0; $('addM').value = 0; $('addM').setCustomValidity('');
  $('addDlg').showModal(); $('addName').focus();
});
$('addCancel').onclick = () => $('addDlg').close();
$('addM').oninput = $('addH').oninput = () => $('addM').setCustomValidity('');
$('addForm').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('addName').value.trim(), mins = (+$('addH').value) * 60 + (+$('addM').value);
  if (!name) return;
  if (mins <= 0) { $('addM').setCustomValidity('Enter a time greater than zero.'); $('addM').reportValidity(); return; }
  let t = state.tasks.find(t => t.name.toLowerCase() === name.toLowerCase());
  if (!t) { t = { id: uid(), name, base: 0 }; state.tasks.unshift(t); }
  // logged as a session starting at midnight of the chosen day (max 23h59m, so it stays within that day)
  state.sessions.push({ id: uid(), taskId: t.id, start: addDay, end: addDay + mins * 6e4, manual: true });
  save(); $('addDlg').close(); render();
});
// hours rounded up to the nearest tenth, one decimal place, whole hours shown without a decimal
const hoursText = ms => { const tenths = Math.ceil(ms / 36e4); return tenths % 10 ? (tenths / 10).toFixed(1) : String(tenths / 10); };
async function copyToClipboard(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove(); return ok;
}
$('cal').addEventListener('click', async e => {
  const b = e.target.closest('[data-copy]'); if (!b) return;
  const ok = await copyToClipboard(copyText[+b.dataset.copy] || '');
  b.textContent = ok ? 'Copied!' : 'Copy failed';
  setTimeout(() => { if (b.isConnected) b.textContent = 'Copy'; }, 1500);
});

function renderWeek() {
  // always compute all 7 days so totals include the weekend; only the first 5 are shown unless weekends are on
  const allDays = [...Array(7)].map((_, i) => { const d = new Date(weekStart); d.setDate(d.getDate() + i); return d; });
  const days = allDays.slice(0, showWeekends ? 7 : 5);
  const bounds = allDays.map(d => { const b = new Date(d); b.setDate(b.getDate() + 1); return [d.getTime(), b.getTime()]; });
  const now = Date.now(), byTask = {}, perDay = allDays.map(() => ({}));
  const names = Object.fromEntries(state.tasks.map(t => [t.id, t.name]));
  const r = running();

  // sum time per task per day (sessions crossing midnight are split)
  state.sessions.forEach(s => {
    const end = s.end ?? now;
    bounds.forEach(([a, b], i) => {
      const ms = Math.min(end, b) - Math.max(s.start, a);
      if (ms > 0) { perDay[i][s.taskId] = (perDay[i][s.taskId] || 0) + ms; byTask[s.taskId] = (byTask[s.taskId] || 0) + ms; }
    });
  });

  // clipboard text per day: "<task name> - <hours>", one task per line
  copyText = perDay.map(m => Object.entries(m).sort((a, b) => b[1] - a[1]).map(([id, v]) => `${names[id] || '(deleted)'} - ${hoursText(v)}`).join('\n'));

  const f = d => d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  $('weekLabel').textContent = `${f(days[0])} \u2013 ${f(days[days.length - 1])}, ${days[days.length - 1].getFullYear()}`;
  const todayStr = new Date().toDateString();

  $('cal').classList.toggle('five', !showWeekends);
  $('cal').innerHTML = days.map((d, i) => {
    const rows = Object.entries(perDay[i]).sort((a, b) => b[1] - a[1]);
    const tot = rows.reduce((a, [, v]) => a + v, 0);
    return `<div class="day ${d.toDateString() === todayStr ? 'today' : ''}">
      <div class="dayhead"><span>${d.toLocaleDateString(undefined, { weekday: 'short' })}<b>${d.getDate()}</b></span><span class="tot">${tot ? fmtShort(tot) : ''}</span>${rows.length ? `<button class="copy" data-copy="${i}" title="Copy tasks and hours to clipboard">Copy</button>` : ''}</div>` +
      '<div class="chips">' + (rows.length ? rows.map(([id, v]) => {
        const nm = names[id] || '(deleted)';
        return `<div class="chip ${r && r.taskId === id && d.toDateString() === todayStr ? 'run' : ''}" style="background:${colorOf(id)};color:${inkOf(colorOf(id))}" title="${esc(nm)}"><div class="cn">${esc(nm)}</div><div class="ct">${fmtShort(v)}</div></div>`;
      }).join('') : '<div class="none">\u2013</div>') + `</div><button class="add" data-add="${new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime()}" title="Add time manually" aria-label="Add time manually for ${esc(d.toLocaleDateString(undefined, { weekday: 'long' }))}">+</button></div>`;
  }).join('');

  const rows = Object.entries(byTask).sort((a, b) => b[1] - a[1]);
  const total = rows.reduce((a, [, v]) => a + v, 0);
  $('legend').innerHTML = rows.length
    ? rows.map(([id, v]) => `<div class="row"><span class="dot" style="background:${colorOf(id)}"></span><span class="n">${esc(names[id] || '(deleted)')}</span><span class="t">${fmtShort(v)}</span></div>`).join('') +
      `<div class="row"><span class="n"><b>Week total</b></span><span class="t"><b>${fmtShort(total)}</b></span></div>`
    : '<div class="empty">No time tracked this week.</div>';
}

/* ---------- loop ---------- */
function render() { view === 'timer' ? renderTimer() : renderWeek(); }
// start of the selected totals period (null = all time, which also includes untimestamped carried-over time)
const periodStart = () => {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  if (period === 'week') d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  else if (period === 'month') d.setDate(1);
  else if (period === '30d') d.setDate(d.getDate() - 29);
  else if (period === 'year') { d.setMonth(0, 1); }
  else return null;
  return d.getTime();
};
const periodMs = t => {
  const from = periodStart();
  if (from === null) return taskTime(t);
  return state.sessions.filter(s => s.taskId === t.id).reduce((a, s) => a + Math.max(0, (s.end ?? Date.now()) - Math.max(s.start, from)), 0);
};
// time shown on the timer view: today's time on the Today list, the period total on the Totals list
const shownMs = t => timerMode === 'today' ? todayTime(t) : periodMs(t);
function tick() {
  if (renderedDay !== null && renderedDay !== dayStart() && view === 'timer') { renderTimer(); return; }   // date rolled over
  const ds = dayStart();
  let sum = 0;
  state.tasks.forEach(t => {
    const v = shownMs(t); sum += v;
    const el = document.querySelector(`.time[data-id="${t.id}"]`);
    if (el) el.textContent = fmt(v);
  });
  $('total').textContent = timerMode === 'today' ? (state.tasks.some(t => worksToday(t, ds)) ? 'Total today: ' + fmt(sum) : '')
                                                  : (sum ? 'Total: ' + fmt(sum) : '');
  const r = running(), t = r && state.tasks.find(t => t.id === r.taskId);
  document.title = t ? `${fmt(todayTime(t))} · ${t.name}` : 'Task Timer';
}
state.tasks.forEach(t => {
  if (t.todayFrom) { const d = new Date(t.todayFrom); d.setHours(0, 0, 0, 0); removeRange(t.id, d.getTime(), t.todayFrom); delete t.todayFrom; save(); }
});
render();
setInterval(tick, 500);
setInterval(() => { if (view === 'week' && running()) renderWeek(); }, 15000);
</script>
</body>
